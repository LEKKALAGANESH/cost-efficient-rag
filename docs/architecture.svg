<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1620" viewBox="0 0 1240 1620" font-family="Segoe UI, Inter, system-ui, sans-serif">
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
</marker>
</defs>
<rect width="1240" height="1620" fill="#ffffff"/>
<text x="620.0" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Cost-Efficient RAG - End-to-End Architecture</text>
<text x="620.0" y="73" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">LanceDB (embedded) - all-MiniLM-L6-v2 384-d - groq/openai/gpt-oss-120b - every value below is a src/config.py default</text>
<text x="40" y="118" text-anchor="start" font-size="15" font-weight="700" fill="#1d4ed8">INDEX TIME  (offline ingestion, runs once per document)</text>
<line x1="40" y1="128" x2="1200" y2="128" stroke="#1d4ed8" stroke-width="1.5" opacity="0.35"/>
<rect x="40" y="148" width="208" height="132" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="144.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1. Corpus</text>
<text x="144.0" y="200" text-anchor="middle" font-size="13" fill="#475569">PDF  -  HTML  -  MD</text>
<text x="144.0" y="219" text-anchor="middle" font-size="13" fill="#475569">pypdf / BeautifulSoup /</text>
<text x="144.0" y="238" text-anchor="middle" font-size="13" fill="#475569">raw text</text>
<rect x="280" y="148" width="208" height="132" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="384.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2. Load + Normalize</text>
<text x="384.0" y="200" text-anchor="middle" font-size="13" fill="#475569">per-page extract</text>
<text x="384.0" y="219" text-anchor="middle" font-size="13" fill="#475569">strip headers/footers</text>
<text x="384.0" y="238" text-anchor="middle" font-size="13" fill="#475569">seen on &gt;50% of pages</text>
<line x1="252" y1="214.0" x2="274" y2="214.0" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="520" y="148" width="208" height="132" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="624.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3. Chunk</text>
<text x="624.0" y="200" text-anchor="middle" font-size="13" fill="#475569">recursive split</text>
<text x="624.0" y="219" text-anchor="middle" font-size="13" fill="#475569">size 500 chars</text>
<text x="624.0" y="238" text-anchor="middle" font-size="13" fill="#475569">overlap 50 chars</text>
<line x1="492" y1="214.0" x2="514" y2="214.0" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="760" y="148" width="208" height="132" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="864.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">4. Embed</text>
<text x="864.0" y="200" text-anchor="middle" font-size="13" fill="#475569">all-MiniLM-L6-v2</text>
<text x="864.0" y="219" text-anchor="middle" font-size="13" fill="#475569">384 dimensions</text>
<text x="864.0" y="238" text-anchor="middle" font-size="13" fill="#475569">local, no API cost</text>
<line x1="732" y1="214.0" x2="754" y2="214.0" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="1000" y="148" width="208" height="132" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="1104.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">5. Store + Payload</text>
<text x="1104.0" y="200" text-anchor="middle" font-size="13" fill="#475569">LanceDB index (cosine)</text>
<text x="1104.0" y="219" text-anchor="middle" font-size="13" fill="#475569">pgvector = 2nd backend</text>
<text x="1104.0" y="238" text-anchor="middle" font-size="13" fill="#475569">payload attached -&gt;</text>
<line x1="972" y1="214.0" x2="994" y2="214.0" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="960" y="306" width="248" height="106" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="1084.0" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">metadata payload</text>
<text x="1084.0" y="358" text-anchor="middle" font-size="13" fill="#475569">chunk_id - doc_key - source</text>
<text x="1084.0" y="377" text-anchor="middle" font-size="13" fill="#475569">chunk_index - file_type - text</text>
<line x1="1104.0" y1="284" x2="1104.0" y2="300" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="40" y="306" width="448" height="106" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="264.0" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">deterministic identity</text>
<text x="264.0" y="358" text-anchor="middle" font-size="13" fill="#475569">doc_key  = sha256(file_bytes)</text>
<text x="264.0" y="377" text-anchor="middle" font-size="13" fill="#475569">chunk_id = sha256(doc_key | index | text)</text>
<text x="264.0" y="396" text-anchor="middle" font-size="13" fill="#475569">re-ingest is idempotent: merge_insert on doc_key adds zero rows</text>
<text x="40" y="452" text-anchor="start" font-size="15" font-weight="700" fill="#1d4ed8">QUERY TIME  (online, per request)</text>
<line x1="40" y1="462" x2="1200" y2="462" stroke="#1d4ed8" stroke-width="1.5" opacity="0.35"/>
<rect x="160.0" y="486" width="400" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="360.0" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">User query</text>
<text x="360.0" y="538" text-anchor="middle" font-size="13" fill="#475569">POST /query  |  CLI  |  eval harness</text>
<rect x="160.0" y="594" width="400" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="360.0" y="622" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Embed query</text>
<text x="360.0" y="646" text-anchor="middle" font-size="13" fill="#475569">same all-MiniLM-L6-v2 encoder</text>
<line x1="360" y1="564" x2="360" y2="588" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="160.0" y="702" width="400" height="104" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="360.0" y="730" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Vector search  -  top-k = 5</text>
<text x="360.0" y="754" text-anchor="middle" font-size="13" fill="#475569">cosine similarity, higher-is-better</text>
<text x="360.0" y="773" text-anchor="middle" font-size="13" fill="#475569">metadata filter: file_type / source / doc_key</text>
<text x="360.0" y="792" text-anchor="middle" font-size="13" fill="#475569">keys outside the allowlist -&gt; 422 before any predicate</text>
<line x1="360" y1="672" x2="360" y2="696" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<polygon points="360,823.0 575.0,898 360,973.0 145.0,898" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="360" y="894" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">GATE A  -  pre-generation</text>
<text x="360" y="912" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">no chunk, or top-1 cosine &lt; 0.30 ?</text>
<line x1="360" y1="810" x2="360" y2="817" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="160.0" y="1007" width="400" height="118" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="360.0" y="1035" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Grounded generation</text>
<text x="360.0" y="1059" text-anchor="middle" font-size="13" fill="#475569">groq/openai/gpt-oss-120b  -  T = 0.0  -  1024 max tokens</text>
<text x="360.0" y="1078" text-anchor="middle" font-size="13" fill="#475569">context wrapped in &lt;context id="{nonce}"&gt;</text>
<text x="360.0" y="1097" text-anchor="middle" font-size="13" fill="#475569">prompt-injection defense: user text never in system prompt</text>
<text x="376" y="997" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">NO  -  context is good enough</text>
<line x1="360" y1="977" x2="360" y2="1001" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<polygon points="360,1142.0 575.0,1217 360,1292.0 145.0,1217" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="360" y="1204" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">GATE B  -  post-generation</text>
<text x="360" y="1222" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">answer == refusal sentence ?</text>
<text x="360" y="1240" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">(exact anchored match, not substring)</text>
<line x1="360" y1="1129" x2="360" y2="1136" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="160.0" y="1326" width="400" height="118" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="360.0" y="1354" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Answer + inline citations</text>
<text x="360.0" y="1378" text-anchor="middle" font-size="13" fill="#475569">[Doc: &lt;source&gt;, Chunk: &lt;chunk_id&gt;]</text>
<text x="360.0" y="1397" text-anchor="middle" font-size="13" fill="#475569">each citation resolved against the retrieved set;</text>
<text x="360.0" y="1416" text-anchor="middle" font-size="13" fill="#475569">invented ones counted as unverified, never passed through</text>
<text x="376" y="1316" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">NO  -  grounded answer</text>
<line x1="360" y1="1296" x2="360" y2="1320" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
<rect x="800" y="979.5" width="400" height="156" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="1000.0" y="1007.5" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">NO-CONTEXT BRANCH  -&gt;  refuse</text>
<text x="1000.0" y="1031.5" text-anchor="middle" font-size="13" fill="#475569">"I do not have sufficient information in</text>
<text x="1000.0" y="1050.5" text-anchor="middle" font-size="13" fill="#475569">the provided context to answer this question."</text>
<text x="1000.0" y="1069.5" text-anchor="middle" font-size="13" fill="#475569"></text>
<text x="1000.0" y="1088.5" text-anchor="middle" font-size="13" fill="#475569">Gate A also skips generation entirely:</text>
<text x="1000.0" y="1107.5" text-anchor="middle" font-size="13" fill="#475569">no LLM call, no tokens, no cost, no hallucination.</text>
<path d="M575,898 L760,898 L760,1031.5 L794,1031.5" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#tip)"/>
<text x="667.5" y="886" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">YES  -  below threshold</text>
<path d="M575,1217 L760,1217 L760,1091.5 L794,1091.5" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#tip)"/>
<text x="667.5" y="1205" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">YES  -  model abstained</text>
<rect x="800" y="1165.5" width="400" height="150" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1000.0" y="1193.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">why two gates, not one</text>
<text x="1000.0" y="1217.5" text-anchor="middle" font-size="13" fill="#475569">Raw bi-encoder cosine is a weak abstention</text>
<text x="1000.0" y="1236.5" text-anchor="middle" font-size="13" fill="#475569">signal: relevant and merely-topical pairs</text>
<text x="1000.0" y="1255.5" text-anchor="middle" font-size="13" fill="#475569">overlap heavily around 0.25-0.45.</text>
<text x="1000.0" y="1274.5" text-anchor="middle" font-size="13" fill="#475569"></text>
<text x="1000.0" y="1293.5" text-anchor="middle" font-size="13" fill="#475569">So the threshold is a cheap pre-filter, and the</text>
<text x="1000.0" y="1312.5" text-anchor="middle" font-size="13" fill="#475569">model's own refusal is the primary mechanism.</text>
<rect x="40" y="1484" width="1160" height="96" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="620.0" y="1512" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Every query is logged  -&gt;  this is what the evaluation reports are computed from</text>
<text x="620.0" y="1536" text-anchor="middle" font-size="13" fill="#475569">latency p50/p95/p99  -  prompt + completion tokens  -  estimated cost  -  top-1 similarity  -  fallback_triggered  -  cache hit</text>
<text x="620.0" y="1555" text-anchor="middle" font-size="13" fill="#475569">Retrieval: Recall@k, Hit Rate, MRR, nDCG@k (IDCG truncated to min(|relevant|, k)), Context Precision vs its achievable ceiling</text>
<line x1="360" y1="1448" x2="360" y2="1478" stroke="#334155" stroke-width="2.2" marker-end="url(#tip)"/>
</svg>
